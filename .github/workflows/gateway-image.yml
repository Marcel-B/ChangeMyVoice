name: Gateway-Abbild

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Kein Abbild aus einem Stand, dessen Tests rot sind.
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml

  image:
    name: Bauen und veröffentlichen
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Marken und Beschriftungen bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Der Pfad folgt dem Repository, damit beim Anlegen nichts
          # nachgezogen werden muss.
          images: ghcr.io/${{ github.repository_owner }}/changemyvoice-gateway
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          # Das Wurzelverzeichnis, weil die zentralen Build-Dateien mitmüssen.
          context: .
          file: src/ChangeMyVoice.Gateway/Dockerfile
          # Proxmox läuft auf x86.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
